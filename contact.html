<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/style.css">
    <title>Contact Me</title>
</head>


<nav>
    <a class="fixed-home" href="index.html">Home</a>
    <a class="fixed-contact" href="contact.html">Contact</a>
    <a class="fixed-about" href="about.html">Learn more about Devil May Cry 5 here</a>
</nav>

<h1>Contact Me</h1>

<form action="#" method="post">

    <fieldset>
        <legend>Devil May Cry 5 Fan Form</legend>

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>

        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>

        <br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="13" max="100">

        <br><br>

        <label for="date">Your birthday:</label>
        <input type="date" id="date" name="date">

        <br><br>

        <label for="color">Favorite color:</label>
        <input type="color" id="color" name="color">

        <br><br>

        <p>Who is your favorite character?</p>
        <input type="radio" id="dante" name="character" value="Dante">
        <label for="dante">Dante</label>

        <input type="radio" id="nero" name="character" value="Nero">
        <label for="nero">Nero</label>

        <input type="radio" id="vergil" name="character" value="Vergil">
        <label for="vergil">Vergil</label>

        <input type="radio" id="V" name="character" value="V">
        <label for="V">V</label>

        <br><br>

        <input type="checkbox" id="fan" name="fan">
        <label for="fan">I am a Devil May Cry fan</label>

        <br><br>

        <label for="message">Your message:</label>
        <br>
        <textarea id="message" name="message" maxlength="300" placeholder="Write your message"></textarea>
        <br><br>
        <input type="submit" value="Send">
    </fieldset>
</form>
